# deploy/ops/ultraos-staging-backup.service.d/privileged-role.conf
#
# The staging DB role (`ultraos_staging`) lacks pg_dump privileges (pg_dump
# LOCKs every table in ACCESS SHARE MODE). Mirror production's fix: swap the
# service's EnvironmentFile for the privileged one.
#
# Requires /opt/ultraos-staging/shared/migrate.env to be readable by the
# `ultraos` user (mode 0640 root:ultraos), same as prod's migrate.env.
[Service]
EnvironmentFile=
EnvironmentFile=/opt/ultraos-staging/shared/migrate.env
