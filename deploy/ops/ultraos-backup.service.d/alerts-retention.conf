# deploy/ops/ultraos-backup.service.d/alerts-retention.conf
#
# 1. Adds the shared failure alert to the production backup unit.
# 2. Defers retention to deploy/ops/backup-retention-all.sh (14 daily + 8 weekly)
#    by disabling the inline prune in web/scripts/backup-database.sh. 3650 is used
#    (not 0) so it is safe even against an older deployed copy of that script,
#    whose default is 14.
[Unit]
OnFailure=backup-alert@%n.service

[Service]
Environment=ULTRA_BACKUP_RETENTION_DAYS=3650
