# deploy/ops/ultraos-backup.service.d/privileged-role.conf
#
# The production backup unit runs as the runtime role, which is subject to RLS
# (pg_dump fails on FORCE-RLS tables like "Accreditation"). Swap the unit's
# EnvironmentFile for the privileged migration role, which is superuser/BYPASSRLS.
# Requires /opt/ultraleagueos/shared/migrate.env (mode 0640 root:ultraos).
[Service]
EnvironmentFile=
EnvironmentFile=/opt/ultraleagueos/shared/migrate.env
