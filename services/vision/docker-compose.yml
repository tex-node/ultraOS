# B0 (P14): vision service. Config comes from the environment (see .env.example).
# The service is scoped to the Vision tables only and never writes canonical scoring data
# (GameEvent/PlayerStat/TeamStat/Standing). See documentation/vision/AI_VISION_ARCHITECTURE.md.

name: ultraos-vision

# Log rotation for every container in this stack (streak v25, Prompt 1). The default json-file driver grows without bound:
# a Celery worker logging at info writes megabytes a day, and this stack shares a VPS with production. 10 MB x 3 files per
# service caps each container at 30 MB, which is 120 MB for the stack instead of an unbounded `docker logs` source.
# One anchor, referenced by all four services, so a new service cannot be added without it by accident - and so the
# numbers live in exactly one place.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

volumes:
  # Vision artifacts that must survive a container being killed or recreated (streak v25, Prompt 2). The worker writes
  # nothing canonical to disk today - observations and tracks go to Postgres and the clips are uploaded to R2 by the web
  # app - so this is deliberately the OUTPUT directory the workers use for scratch frames and exported clips, mounted at
  # /data. A named volume rather than a bind mount: it survives `docker compose down`, is not deleted by `git clean -fdx`,
  # and can be inspected with `docker run --rm -v ultraos-vision_vision-data:/data alpine ls /data`.
  vision-data:

services:
  vision-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${VISION_IMAGE:-ultraos-vision:dev}
    # The env file is NOT committed and must NOT live in a deploy checkout: every deploy runs git clean -fdx, which
    # deleted the v24 .env and left this stack unable to recreate itself (the running containers kept working, which is
    # why nobody noticed). It lives outside any checkout and is named explicitly:
    #   /opt/ultraos-vision/vision.env  ->  VISION_ENV_FILE=/opt/ultraos-vision/vision.env
    env_file:
      - ${VISION_ENV_FILE:-.env}
    # The app's media directory, read-only (streak v24): a MediaAsset objectKey is stored relative to it, and without the
    # mount the analyzer looked for the file inside the image and failed with "cannot open video".
    volumes:
      - ${VISION_MEDIA_DIR:?VISION_MEDIA_DIR must be set. See documentation/runbooks/SHARED_VPS_RISK.md}:/data/media:ro
      - vision-data:/data
    ports:
      - "${VISION_API_PORT:-8000}:8000"
    depends_on:
      - vision-redis
    restart: unless-stopped
    logging: *default-logging
    # Only the API serves HTTP, so only the API gets a healthcheck. The worker and beat are alive or not -
    # their liveness is the container state plus their logs, not a port probe.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    # 1 GB: the API loads the model once for a single-frame request and serves health checks; it does not batch.
    deploy:
      resources:
        limits:
          memory: 1G

  vision-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${VISION_IMAGE:-ultraos-vision:dev}
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=1
    # The env file is NOT committed and must NOT live in a deploy checkout: every deploy runs git clean -fdx, which
    # deleted the v24 .env and left this stack unable to recreate itself (the running containers kept working, which is
    # why nobody noticed). It lives outside any checkout and is named explicitly:
    #   /opt/ultraos-vision/vision.env  ->  VISION_ENV_FILE=/opt/ultraos-vision/vision.env
    env_file:
      - ${VISION_ENV_FILE:-.env}
    volumes:
      - ${VISION_MEDIA_DIR:?VISION_MEDIA_DIR must be set. See documentation/runbooks/SHARED_VPS_RISK.md}:/data/media:ro
      - vision-data:/data
    depends_on:
      - vision-redis
    restart: unless-stopped
    logging: *default-logging
    # A cap, not a reservation (streak v25, Prompt 3): a runaway worker must be killed by the kernel before it starves
    # Postgres or the web app on the same host. 2 GB is several times the measured peak for a 300-frame clip.
    deploy:
      resources:
        limits:
          memory: 2G

  vision-redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - "${VISION_REDIS_PORT:-6380}:6379"
    restart: unless-stopped
    logging: *default-logging
    # 512 MB: a queue with no persistence needs pointers, not data.
    deploy:
      resources:
        limits:
          memory: 512M

  vision-beat:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${VISION_IMAGE:-ultraos-vision:dev}
    command: celery -A app.workers.celery_app beat --loglevel=info
    # The env file is NOT committed and must NOT live in a deploy checkout: every deploy runs git clean -fdx, which
    # deleted the v24 .env and left this stack unable to recreate itself (the running containers kept working, which is
    # why nobody noticed). It lives outside any checkout and is named explicitly:
    #   /opt/ultraos-vision/vision.env  ->  VISION_ENV_FILE=/opt/ultraos-vision/vision.env
    env_file:
      - ${VISION_ENV_FILE:-.env}
    depends_on:
      - vision-redis
    restart: unless-stopped
    logging: *default-logging
    # 256 MB: the scheduler writes a schedule file and sleeps.
    deploy:
      resources:
        limits:
          memory: 256M
