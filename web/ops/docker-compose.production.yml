services:
  postgres:
    image: postgres:16-alpine
    container_name: ultraos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ultraleagueos
      POSTGRES_USER: ultraos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:55411:5432"
    volumes:
      - /opt/ultraleagueos/shared/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ultraos -d ultraleagueos"]
      interval: 5s
      timeout: 5s
      retries: 20
