[package]
name = "ultraos-desktop"
version = "0.1.0"
description = "UltraOS Scoring — desktop shell around the hosted scoring app"
authors = ["Neon Ultra"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ultraos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
