[package]
name = "ultraos-desktop"
version = "0.1.0"
description = "UltraOS Scoring — desktop shell around the hosted scoring app"
authors = ["Neon Ultra"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ultraos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
tower-http = { version = "0.5", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# bundled: the app ships its own SQLite rather than depending on whatever DLL a venue laptop happens to have.
rusqlite = { version = "0.31", features = ["bundled"] }
hmac = "0.12"
sha2 = "0.10"
ureq = { version = "2", features = ["tls"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# The dev profile carries no debug info: this shell is 300 lines, and full DWARF inflated the link step by ~2 GB on a machine
# that had 300 MB free. If you need a debugger, flip this locally - do not commit it.
[profile.dev]
debug = 0
incremental = false
