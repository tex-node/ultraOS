name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Prisma validate + generate
        run: |
          npm run db:validate
          npm run db:generate
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      # P13/A3a ratchet: the canonical-write suppression baseline may shrink, never grow.
      - name: Canonical-write baseline (monotonic shrink)
        run: npm run lint:canonical-writes
      - name: Unit tests
        run: npm test

  vision:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/vision
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/vision/requirements.txt
      - run: pip install -r requirements.txt
      - name: Pytest
        run: python -m pytest -q
