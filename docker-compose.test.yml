services:
  postgres:
    image: postgres:16-alpine
    container_name: ultraos-e2e-postgres
    environment:
      POSTGRES_USER: ultraos
      POSTGRES_PASSWORD: test
      POSTGRES_DB: ultraleagueos_test
    ports:
      - "55432:5432"
    volumes:
      - ultraos-e2e-data:/var/lib/postgresql/data
      # Roles the migrations GRANT to must exist before `prisma migrate deploy` (see the file's own comment).
      - ./docker/test-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ultraos -d ultraleagueos_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    command:
      - "postgres"
      - "-c"
      - "fsync=off"
      - "-c"
      - "synchronous_commit=off"
      - "-c"
      - "full_page_writes=off"

volumes:
  ultraos-e2e-data:
